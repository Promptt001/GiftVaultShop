plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
version = '0.3.0'
group = 'dev.giftshop'
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }


tasks.register('verifyShop', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.giftshop.ShopChecks'
    maxHeapSize = '384m'
    jvmArgs '-XX:ActiveProcessorCount=2'
}
check.dependsOn verifyShop
test { enabled = false } // Standalone assertions run by verifyShop.

processResources {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
